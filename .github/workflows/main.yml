name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123","project_id":"id","storage_bucket":"b"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"hr.algebra.idlereservations"}},"api_key":[{"current_key":"key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}] ,"configuration_version":"1"}' > Android/app/google-services.json

      - name: Run Android Unit Tests
        run: cd Android && ./gradlew testDebugUnitTest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: cd Frontend && npm install

      - name: Run Frontend Tests
        run: cd Frontend && npm test

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Backend/IdleReservationsBE/IdleReservationsBE.sln

      - name: Build Backend
        run: dotnet build Backend/IdleReservationsBE/IdleReservationsBE.sln --no-restore

      - name: Run Backend Tests
        run: dotnet test Backend/IdleReservationsBE/IdleReservationsBE.sln --no-build --verbosity normal
